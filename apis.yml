aid: macrofab
name: MacroFab
description: >-
  MacroFab is a US-based electronics manufacturing services (EMS) company operating a
  digital manufacturing platform for PCB assembly, from prototype to production. Its
  platform is powered by FabIQ, a manufacturing AI that automates instant quoting,
  component sourcing, and supply-chain intelligence: engineers upload design files
  (Gerbers, ODB++, native EDA formats) and receive itemized quotes with live BOM
  pricing against distributor inventory, component alternate suggestions, tariff impact
  analysis, consigned inventory management, and real-time order tracking. Founded in
  2013 and headquartered in Houston, TX, MacroFab runs ITAR-registered, ISO 9001:2015
  certified, DPAS-rated US manufacturing lines serving industrial, defense, autonomous
  systems, and test-and-measurement customers. The customer platform (factory.macrofab.com)
  is authenticated via OpenID Connect / OAuth2; MacroFab does not publish an open API
  specification.
